<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>えみざ ↔ うみ家</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">

<style>
:root {
  --bg: #fafafa;
  --bg2: #ffffff;
  --fg: #1a1a1a;
  --fg2: #666;
  --accent: #c0657a;
  --accent-soft: #f5e8eb;
  --green: #22aa22;
  --green-soft: #e8f5e8;
  --yellow: #d09020;
  --yellow-soft: #fdf5e0;
  --blue: #4070c0;
  --blue-soft: #e8eeff;
  --border: #e8e0e2;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1618; --bg2: #221e20; --fg: #f0eaec; --fg2: #a89498;
    --accent: #d4849a; --accent-soft: #2e1e23;
    --green: #44cc44; --green-soft: #1a2e1a;
    --yellow: #d4a040; --yellow-soft: #2e2010;
    --blue: #6090e0; --blue-soft: #101828;
    --border: #3a2e31; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 選択画面 */
#select-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100vh; gap: 1rem;
}
#select-screen h1 { font-size: 1.1rem; color: var(--fg2); margin: 0 0 0.5rem; }
.select-btn {
  width: 220px; padding: 1rem;
  border: 2px solid var(--border); border-radius: var(--radius);
  background: var(--bg2); color: var(--fg);
  font-family: 'Noto Sans JP', sans-serif; font-size: 1.1rem; font-weight: 700;
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.select-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

/* メイン */
#main-screen { display: none; max-width: 500px; margin: 0 auto; padding-block: 1.5rem; }
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.2rem;
}
.top-bar span { color: var(--fg2); font-size: 0.9rem; }
.top-bar strong { color: var(--accent); }
.switch-btn {
  font-size: 0.8rem; color: var(--fg2); background: none;
  border: 1px solid var(--border); border-radius: 20px;
  padding: 0.3rem 0.8rem; cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
}
.tabs {
  display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 1.2rem;
}
.tab-btn {
  flex: 1; padding: 0.7rem; background: none; border: none;
  font-family: 'Noto Sans JP', sans-serif; font-size: 0.95rem; font-weight: 500;
  color: var(--fg2); cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: color 0.15s;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

.card {
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 1.3rem 1.5rem; margin-bottom: 1rem;
}
.card-label {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--fg2); margin-bottom: 0.8rem;
}
.name-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;
}
.name-row .name { font-size: 1.1rem; font-weight: 700; }
.status-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.status-opt {
  flex: 1; min-width: 70px; padding: 0.6rem 0.4rem;
  border: 1.5px solid var(--border); border-radius: 10px;
  background: var(--bg); color: var(--fg2);
  font-family: 'Noto Sans JP', sans-serif; font-size: 0.82rem; font-weight: 500;
  cursor: pointer; text-align: center; transition: all 0.15s;
}
.status-opt.active-work { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.status-opt.active-posting { border-color: var(--yellow); background: var(--yellow-soft); color: var(--yellow); }
.status-opt.active-saving { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.status-opt.active-off { border-color: #cc4444; background: #fde8e8; color: #cc2222; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .status-opt.active-off { background: #2e1010; color: #ee6666; }
}

.other-row {
  display: flex; align-items: center; justify-content: space-between;
}
.other-name { font-size: 1.05rem; font-weight: 700; }
.other-st { font-size: 0.9rem; font-weight: 700; color: var(--fg2); }
.other-st.work { color: var(--green); }
.other-st.posting { color: var(--yellow); }
.other-st.saving { color: var(--blue); }
.other-st.off { color: var(--fg2); }
.upd-time { font-size: 0.75rem; color: var(--fg2); margin-top: 0.3rem; }
.refresh-row { display: flex; justify-content: flex-end; margin-top: 0.6rem; }
.refresh-btn {
  background: none; border: 1px solid var(--border); border-radius: 20px;
  padding: 0.3rem 0.9rem; font-size: 0.82rem; color: var(--fg2);
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
}

/* チャット */
#chat-tab { display: none; }
.chat-box {
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius); height: 350px; overflow-y: auto;
  padding: 1rem; margin-bottom: 0.8rem;
  display: flex; flex-direction: column; gap: 0.6rem;
}
.msg-row { display: flex; flex-direction: column; max-width: 80%; }
.msg-row.mine { align-self: flex-end; align-items: flex-end; }
.msg-row.theirs { align-self: flex-start; align-items: flex-start; }
.msg-name { font-size: 0.72rem; color: var(--fg2); margin-bottom: 0.2rem; }
.msg-bubble {
  padding: 0.5rem 0.9rem; border-radius: 16px;
  font-size: 0.9rem; line-height: 1.5; word-break: break-word;
}
.msg-row.mine .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg-row.theirs .msg-bubble { background: var(--border); color: var(--fg); border-bottom-left-radius: 4px; }
.msg-time { font-size: 0.68rem; color: var(--fg2); margin-top: 0.2rem; }
.msg-read { font-size: 0.68rem; color: var(--accent); margin-top: 0.1rem; }
.chat-empty { color: var(--fg2); font-size: 0.9rem; text-align: center; margin: auto; }
.chat-input-row { display: flex; gap: 0.6rem; align-items: flex-end; }
.chat-input {
  flex: 1; padding: 0.7rem 1rem;
  border: 1.5px solid var(--border); border-radius: 20px;
  background: var(--bg2); color: var(--fg);
  font-family: 'Noto Sans JP', sans-serif; font-size: 0.93rem;
  outline: none; resize: none;
}
.chat-input:focus { border-color: var(--accent); }
.send-btn {
  padding: 0.7rem 1.2rem; background: var(--accent); color: #fff;
  border: none; border-radius: 20px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; font-weight: 700;
  cursor: pointer; white-space: nowrap;
}
.send-btn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<!-- 選択画面 -->
<div id="select-screen">
  <h1>あなたはどちらですか？</h1>
  <button class="select-btn" onclick="selectUser('A')">えみざ</button>
  <button class="select-btn" onclick="selectUser('B')">うみ家</button>
</div>

<!-- メイン画面 -->
<div id="main-screen">
  <div class="top-bar">
    <span><strong id="my-name-top"></strong> としてログイン中</span>
    <button class="switch-btn" onclick="switchUser()">切り替え</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-status" onclick="showTab('status')">📊 ステータス</button>
    <button class="tab-btn" id="tab-chat" onclick="showTab('chat')">💬 チャット</button>
  </div>

  <!-- ステータスタブ -->
  <div id="status-tab">
    <div class="card">
      <div class="card-label">自分のステータス</div>
      <div class="name-row">
        <span class="name" id="my-name"></span>
      </div>
      <div class="status-buttons">
        <button class="status-opt" id="btn-work" onclick="setStatus('work')">🟢 稼働中</button>
        <button class="status-opt" id="btn-posting" onclick="setStatus('posting')">📝 投稿中</button>
        <button class="status-opt" id="btn-saving" onclick="setStatus('saving')">💾 保存中</button>
        <button class="status-opt" id="btn-off" onclick="setStatus('off')">⚫ 停止中</button>
      </div>
    </div>
    <div id="other-card"></div>
    <div class="refresh-row">
      <button class="refresh-btn" id="refresh-btn" onclick="fetchStatus()">🔄 更新</button>
    </div>
  </div>

  <!-- チャットタブ -->
  <div id="chat-tab">
    <div class="chat-box" id="chat-box">
      <span class="chat-empty">メッセージはまだありません</span>
    </div>
    <div class="chat-input-row">
      <textarea class="chat-input" id="chat-input" rows="1" placeholder="メッセージを入力..."></textarea>
      <button class="send-btn" id="send-btn" onclick="sendChat()">送信</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwFxDAw5Xfn87sx3fZbNQPQTgvhxhblsrDbMIP-RlfY-y9RY3E93udomiG_369N8YE/exec';
// このページの2人
const USERS = { A: 'えみざ', B: 'うみ家' };
const OTHER = { A: 'B', B: 'A' };
const STATUS_INFO = {
  work:    { text: '🟢 稼働中', cls: 'work' },
  posting: { text: '📝 投稿中', cls: 'posting' },
  saving:  { text: '💾 保存中', cls: 'saving' },
  off:     { text: '⚫ 停止中', cls: 'off' },
};

let myKey = null;
let currentStatus = 'off';
let chatInterval = null;
let statusInterval = null;

function gasRequest(params) {
  return new Promise((resolve, reject) => {
    const cbName = '_gcb' + Date.now() + Math.floor(Math.random()*1000);
    const script = document.createElement('script');
    const timer = setTimeout(() => {
      delete window[cbName]; script.remove(); reject(new Error('timeout'));
    }, 10000);
    window[cbName] = function(data) {
      clearTimeout(timer); delete window[cbName]; script.remove(); resolve(data);
    };
    params.callback = cbName;
    script.src = GAS_URL + '?' + new URLSearchParams(params).toString();
    script.onerror = () => { clearTimeout(timer); delete window[cbName]; script.remove(); reject(new Error('error')); };
    document.head.appendChild(script);
  });
}

function selectUser(key) {
  myKey = key;
  try { localStorage.setItem('gw_eu_user', key); } catch(e){}
  document.getElementById('select-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  document.getElementById('my-name-top').textContent = USERS[key];
  document.getElementById('my-name').textContent = USERS[key];
  try {
    const s = sessionStorage.getItem('gw_eu_status_' + key);
    if (s && STATUS_INFO[s]) currentStatus = s;
    else currentStatus = 'off';
  } catch(e){ currentStatus = 'off'; }
  updateMyUI();
  setStatus(currentStatus);
  fetchStatus();
  statusInterval = setInterval(fetchStatus, 30000);
}

function switchUser() {
  myKey = null;
  if (statusInterval) clearInterval(statusInterval);
  if (chatInterval) clearInterval(chatInterval);
  document.getElementById('select-screen').style.display = 'flex';
  document.getElementById('main-screen').style.display = 'none';
  showTab('status');
}

function showTab(tab) {
  document.getElementById('status-tab').style.display = tab === 'status' ? 'block' : 'none';
  document.getElementById('chat-tab').style.display = tab === 'chat' ? 'block' : 'none';
  document.getElementById('tab-status').className = 'tab-btn' + (tab === 'status' ? ' active' : '');
  document.getElementById('tab-chat').className = 'tab-btn' + (tab === 'chat' ? ' active' : '');
  if (tab === 'chat') {
    fetchChat();
    if (!chatInterval) chatInterval = setInterval(fetchChat, 10000);
  } else {
    if (chatInterval) { clearInterval(chatInterval); chatInterval = null; }
  }
}

function updateMyUI() {
  ['work','posting','saving','off'].forEach(s => {
    document.getElementById('btn-' + s).className = 'status-opt' + (s === currentStatus ? ' active-' + s : '');
  });
}

async function setStatus(status) {
  currentStatus = status;
  try { sessionStorage.setItem('gw_eu_status_' + myKey, status); } catch(e){}
  updateMyUI();
  try {
    await gasRequest({ key: myKey, active: status !== 'off', status: status });
  } catch(e) {}
}

async function fetchStatus() {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.textContent = '⏳';
  try {
    const data = await gasRequest({ t: Date.now() });
    const otherKey = OTHER[myKey];
    const other = data[otherKey];
    const st = other ? (other.status || (other.active ? 'work' : 'off')) : 'off';
    const info = STATUS_INFO[st] || STATUS_INFO['off'];
    let updText = '';
    if (other && other.updated) {
      const d = new Date(other.updated);
      if (!isNaN(d.getTime())) {
        updText = '最終更新: ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      }
    }
    document.getElementById('other-card').innerHTML = `
      <div class="card">
        <div class="card-label">相手のステータス</div>
        <div class="other-row">
          <span class="other-name">${USERS[otherKey]}</span>
          <span class="other-st ${info.cls}">${info.text}</span>
        </div>
        <div class="upd-time">${updText}</div>
      </div>`;
  } catch(e) {}
  if (btn) btn.textContent = '🔄 更新';
}

async function fetchChat() {
  if (!myKey) return;
  const otherKey = OTHER[myKey];
  try {
    const data = await gasRequest({ action: 'getChat', from: myKey, to: otherKey, t: Date.now() });
    const box = document.getElementById('chat-box');
    const msgs = data.messages || [];
    if (msgs.length === 0) {
      box.innerHTML = '<span class="chat-empty">メッセージはまだありません</span>';
      return;
    }
    const wasBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    box.innerHTML = msgs.map(m => {
      const mine = m.from === myKey;
      const d = new Date(m.time);
      const hhmm = isNaN(d.getTime()) ? '' : d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      const readBy = m.readBy ? String(m.readBy) : '';
      const isRead = mine && readBy.split(',').some(k => k.trim() && k.trim() !== myKey);
      return `<div class="msg-row ${mine ? 'mine' : 'theirs'}">
        <div class="msg-name">${USERS[m.from] || m.from}</div>
        <div class="msg-bubble">${escHtml(m.msg)}</div>
        <div class="msg-time">${hhmm}</div>
        ${mine ? `<div class="msg-read">${isRead ? '既読' : ''}</div>` : ''}
      </div>`;
    }).join('');
    if (wasBottom) box.scrollTop = box.scrollHeight;
  } catch(e) {}
}

async function sendChat() {
  if (!myKey) return;
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  input.value = '';
  const otherKey = OTHER[myKey];
  try {
    await gasRequest({ action: 'sendChat', from: myKey, to: otherKey, msg: msg });
    await fetchChat();
    const box = document.getElementById('chat-box');
    box.scrollTop = box.scrollHeight;
  } catch(e) { input.value = msg; }
  btn.disabled = false;
  input.focus();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// 前回ユーザー記憶
try {
  const saved = localStorage.getItem('gw_eu_user');
  if (saved && USERS[saved]) selectUser(saved);
} catch(e) {}
</script>
</body>

  flex: 1; min-width: 70px; padding: 0.6rem 0.4rem;
  border: 1.5px solid var(--border); border-radius: 10px;
  background: var(--bg); color: var(--fg2);
  font-family: 'Noto Sans JP', sans-serif; font-size: 0.82rem; font-weight: 500;
  cursor: pointer; text-align: center; transition: all 0.15s;
}
.status-opt.active-work { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.status-opt.active-posting { border-color: var(--yellow); background: var(--yellow-soft); color: var(--yellow); }
.status-opt.active-saving { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.status-opt.active-off { border-color: #cc4444; background: #fde8e8; color: #cc2222; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .status-opt.active-off { background: #2e1010; color: #ee6666; }
}
:root[data-theme="dark"] .status-opt.active-off { background: #2e1010; color: #ee6666; }

.other-row {
  display: flex; align-items: center; justify-content: space-between;
}
.other-name { font-size: 1.05rem; font-weight: 700; }
.other-st { font-size: 0.9rem; font-weight: 700; color: var(--fg2); }
.other-st.work { color: var(--green); }
.other-st.posting { color: var(--yellow); }
.other-st.saving { color: var(--blue); }
.other-st.off { color: var(--fg2); }
.upd-time { font-size: 0.75rem; color: var(--fg2); margin-top: 0.3rem; }
.refresh-row { display: flex; justify-content: flex-end; margin-top: 0.6rem; }
.refresh-btn {
  background: none; border: 1px solid var(--border); border-radius: 20px;
  padding: 0.3rem 0.9rem; font-size: 0.82rem; color: var(--fg2);
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
}

/* ===== チャット ===== */
#chat-tab { display: none; }

/* 相手選択リスト */
.chat-partner-list { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
.partner-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 0.9rem 1.2rem;
  cursor: pointer; transition: border-color 0.15s;
}
.partner-item:hover { border-color: var(--accent); }
.partner-name { font-weight: 700; font-size: 1rem; }
.partner-unread {
  background: var(--accent); color: #fff;
  border-radius: 20px; padding: 0.1rem 0.6rem;
  font-size: 0.78rem; font-weight: 700; min-width: 20px; text-align: center;
}
.partner-unread:empty { display: none; }

/* 個別チャット */
#chat-room { display: none; }
.chat-room-header {
  display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem;
}
.back-btn {
  background: none; border: 1px solid var(--border); border-radius: 20px;
  padding: 0.3rem 0.8rem; font-size: 0.82rem; color: var(--fg2);
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
}
.chat-room-name { font-size: 1.05rem; font-weight: 700; }

.chat-box {
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius); height: 320px; overflow-y: auto;
  padding: 1rem; margin-bottom: 0.8rem;
  display: flex; flex-direction: column; gap: 0.6rem;
}
.msg-row { display: flex; flex-direction: column; max-width: 80%; }
.msg-row.mine { align-self: flex-end; align-items: flex-end; }
.msg-row.theirs { align-self: flex-start; align-items: flex-start; }
.msg-name { font-size: 0.72rem; color: var(--fg2); margin-bottom: 0.2rem; }
.msg-bubble {
  padding: 0.5rem 0.9rem; border-radius: 16px;
  font-size: 0.9rem; line-height: 1.5; word-break: break-word;
}
.msg-row.mine .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg-row.theirs .msg-bubble { background: var(--border); color: var(--fg); border-bottom-left-radius: 4px; }
.msg-time { font-size: 0.68rem; color: var(--fg2); margin-top: 0.2rem; }
.msg-read { font-size: 0.68rem; color: var(--accent); margin-top: 0.1rem; }
.chat-empty { color: var(--fg2); font-size: 0.9rem; text-align: center; margin: auto; }

.chat-input-row { display: flex; gap: 0.6rem; align-items: flex-end; }
.chat-input {
  flex: 1; padding: 0.7rem 1rem;
  border: 1.5px solid var(--border); border-radius: 20px;
  background: var(--bg2); color: var(--fg);
  font-family: 'Noto Sans JP', sans-serif; font-size: 0.93rem;
  outline: none; resize: none;
}
.chat-input:focus { border-color: var(--accent); }
.send-btn {
  padding: 0.7rem 1.2rem; background: var(--accent); color: #fff;
  border: none; border-radius: 20px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; font-weight: 700;
  cursor: pointer; white-space: nowrap;
}
.send-btn:disabled { opacity: 0.5; cursor: default; }
</style>

<!-- 選択画面 -->
<div id="select-screen">
  <h1>あなたはどちらですか？</h1>
  <button class="select-btn" onclick="startLogin('A')">えみざ</button>
  <button class="select-btn" onclick="startLogin('B')">うみ家</button>
  <button class="select-btn" onclick="startLogin('C')">Mなおじさん</button>
</div>

<!-- パスワード画面 -->
<div id="pw-screen">
  <h2 id="pw-title"></h2>
  <p id="pw-desc"></p>
  <input class="pw-input" id="pw-input" type="password" placeholder="パスワード"
    onkeydown="if(event.key==='Enter')document.getElementById('pw-submit').click()">
  <div class="pw-error" id="pw-error"></div>
  <button class="pw-btn" id="pw-submit" onclick="submitPassword()">ログイン</button>
  <button class="pw-back" onclick="backToSelect()">← 戻る</button>
</div>

<!-- メイン画面 -->
<div id="main-screen">
  <div class="top-bar">
    <span><strong id="my-name-top"></strong> としてログイン中</span>
    <div style="display:flex;gap:0.5rem;">
      <button class="switch-btn" onclick="changePassword()">🔑 PW変更</button>
      <button class="switch-btn" onclick="switchUser()">切り替え</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-status" onclick="showTab('status')">📊 ステータス</button>
    <button class="tab-btn" id="tab-chat" onclick="showTab('chat')">💬 チャット</button>
  </div>

  <!-- ステータスタブ -->
  <div id="status-tab">
    <div class="card">
      <div class="card-label">自分のステータス</div>
      <div class="name-row">
        <span class="name" id="my-name"></span>
      </div>
      <div class="status-buttons">
        <button class="status-opt" id="btn-work" onclick="setStatus('work')">🟢 稼働中</button>
        <button class="status-opt" id="btn-posting" onclick="setStatus('posting')">📝 投稿中</button>
        <button class="status-opt" id="btn-saving" onclick="setStatus('saving')">💾 保存中</button>
        <button class="status-opt" id="btn-off" onclick="setStatus('off')">⚫ 停止中</button>
      </div>
    </div>
    <div id="others-status-cards"></div>
    <div class="refresh-row">
      <button class="refresh-btn" id="refresh-btn" onclick="fetchStatus()">🔄 更新</button>
    </div>
  </div>

  <!-- チャットタブ -->
  <div id="chat-tab">
    <!-- 相手選択 -->
    <div id="chat-list">
      <div class="chat-partner-list" id="partner-list"></div>
    </div>
    <!-- 個別チャット -->
    <div id="chat-room">
      <div class="chat-room-header">
        <button class="back-btn" onclick="backToList()">← 戻る</button>
        <span class="chat-room-name" id="chat-room-name"></span>
      </div>
      <div class="chat-box" id="chat-box">
        <span class="chat-empty">メッセージはまだありません</span>
      </div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="メッセージを入力..." tabindex="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendChat()" tabindex="2">送信</button>
      </div>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwFxDAw5Xfn87sx3fZbNQPQTgvhxhblsrDbMIP-RlfY-y9RY3E93udomiG_369N8YE/exec';
const USERS = { A: 'えみざ', B: 'うみ家', C: 'Mなおじさん' };
const STATUS_INFO = {
  work:    { text: '🟢 稼働中', cls: 'work' },
  posting: { text: '📝 投稿中', cls: 'posting' },
  saving:  { text: '💾 保存中', cls: 'saving' },
  off:     { text: '⚫ 停止中', cls: 'off' },
};

let myKey = null;
let pendingKey = null;
let currentStatus = 'off';
let chatInterval = null;
let statusInterval = null;
let currentPartner = null;

async function startLogin(key) {
  pendingKey = key;
  document.getElementById('select-screen').style.display = 'none';
  document.getElementById('pw-screen').style.display = 'flex';
  document.getElementById('pw-title').textContent = USERS[key] + ' でログイン';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').textContent = '';
  document.getElementById('pw-submit').textContent = '確認中...';
  document.getElementById('pw-submit').disabled = true;
  try {
    const res = await gasRequest({ action: 'checkPw', key: key, pw: '__check__' });
    if (res.notSet) {
      document.getElementById('pw-desc').textContent = '初回です。新しいパスワードを設定してください';
      document.getElementById('pw-submit').textContent = 'パスワードを設定してログイン';
    } else {
      document.getElementById('pw-desc').textContent = 'パスワードを入力してください';
      document.getElementById('pw-submit').textContent = 'ログイン';
    }
  } catch(e) {
    document.getElementById('pw-desc').textContent = 'パスワードを入力してください';
    document.getElementById('pw-submit').textContent = 'ログイン';
  }
  document.getElementById('pw-submit').disabled = false;
  setTimeout(() => document.getElementById('pw-input').focus(), 100);
}

async function submitPassword() {
  const input = document.getElementById('pw-input').value;
  if (!input) { document.getElementById('pw-error').textContent = 'パスワードを入力してください'; return; }
  const btn = document.getElementById('pw-submit');
  btn.disabled = true;
  btn.textContent = '確認中...';
  document.getElementById('pw-error').textContent = '';
  try {
    const res = await gasRequest({ action: 'checkPw', key: pendingKey, pw: input });
    if (res.notSet) {
      // 初回設定
      const setRes = await gasRequest({ action: 'setPw', key: pendingKey, newPw: input });
      if (setRes.ok) {
        document.getElementById('pw-screen').style.display = 'none';
        selectUser(pendingKey);
      } else {
        document.getElementById('pw-error').textContent = '設定に失敗しました';
      }
    } else if (res.ok) {
      document.getElementById('pw-screen').style.display = 'none';
      selectUser(pendingKey);
    } else {
      document.getElementById('pw-error').textContent = 'パスワードが違います';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  } catch(e) {
    document.getElementById('pw-error').textContent = '通信エラー、もう一度試して';
  }
  btn.disabled = false;
  btn.textContent = 'ログイン';
}

function backToSelect() {
  document.getElementById('pw-screen').style.display = 'none';
  document.getElementById('select-screen').style.display = 'flex';
  pendingKey = null;
}

async function changePassword() {
  const oldPw = prompt('現在のパスワードを入力してください');
  if (oldPw === null) return;
  const newPw = prompt('新しいパスワードを入力してください');
  if (!newPw) return;
  const newPw2 = prompt('新しいパスワードをもう一度入力してください');
  if (newPw !== newPw2) { alert('パスワードが一致しません'); return; }
  try {
    const res = await gasRequest({ action: 'setPw', key: myKey, oldPw: oldPw, newPw: newPw });
    if (res.ok) alert('パスワードを変更しました！');
    else alert(res.msg || '変更に失敗しました');
  } catch(e) { alert('通信エラー'); }
}

function gasRequest(params) {
  return new Promise((resolve, reject) => {
    const cbName = '_gcb' + Date.now() + Math.floor(Math.random()*1000);
    const script = document.createElement('script');
    const timer = setTimeout(() => {
      delete window[cbName]; script.remove(); reject(new Error('timeout'));
    }, 10000);
    window[cbName] = function(data) {
      clearTimeout(timer); delete window[cbName]; script.remove(); resolve(data);
    };
    params.callback = cbName;
    script.src = GAS_URL + '?' + new URLSearchParams(params).toString();
    script.onerror = () => { clearTimeout(timer); delete window[cbName]; script.remove(); reject(new Error('error')); };
    document.head.appendChild(script);
  });
}

function selectUser(key) {
  myKey = key;
  try { localStorage.setItem('gw_page_user', key); } catch(e){}
  document.getElementById('select-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  document.getElementById('my-name-top').textContent = USERS[key];
  document.getElementById('my-name').textContent = USERS[key];
  try {
    const s = sessionStorage.getItem('gw_page_status_' + key);
    if (s && STATUS_INFO[s]) currentStatus = s;
    else currentStatus = 'off';
  } catch(e){ currentStatus = 'off'; }
  buildPartnerList();
  updateMyUI();
  setStatus(currentStatus);
  fetchStatus();
  statusInterval = setInterval(fetchStatus, 30000);
}

function buildPartnerList() {
  const list = document.getElementById('partner-list');
  list.innerHTML = '';
  Object.keys(USERS).forEach(k => {
    if (k === myKey) return;
    const item = document.createElement('div');
    item.className = 'partner-item';
    item.id = 'partner-' + k;
    item.innerHTML = `<span class="partner-name">${USERS[k]}</span><span class="partner-unread" id="unread-${k}"></span>`;
    item.onclick = () => openChat(k);
    list.appendChild(item);
  });
}

function switchUser() {
  myKey = null;
  if (statusInterval) clearInterval(statusInterval);
  if (chatInterval) clearInterval(chatInterval);
  currentPartner = null;
  document.getElementById('select-screen').style.display = 'flex';
  document.getElementById('main-screen').style.display = 'none';
  showTab('status');
}

function showTab(tab) {
  document.getElementById('status-tab').style.display = tab === 'status' ? 'block' : 'none';
  document.getElementById('chat-tab').style.display = tab === 'chat' ? 'block' : 'none';
  document.getElementById('tab-status').className = 'tab-btn' + (tab === 'status' ? ' active' : '');
  document.getElementById('tab-chat').className = 'tab-btn' + (tab === 'chat' ? ' active' : '');
  if (tab === 'chat') {
    backToList();
    checkAllUnread();
    if (!chatInterval) chatInterval = setInterval(checkAllUnread, 10000);
  } else {
    if (chatInterval) { clearInterval(chatInterval); chatInterval = null; }
  }
}

function openChat(partnerKey) {
  currentPartner = partnerKey;
  document.getElementById('chat-list').style.display = 'none';
  document.getElementById('chat-room').style.display = 'block';
  document.getElementById('chat-room-name').textContent = USERS[partnerKey];
  if (chatInterval) clearInterval(chatInterval);
  fetchChat();
  chatInterval = setInterval(fetchChat, 10000);
}

function backToList() {
  currentPartner = null;
  document.getElementById('chat-room').style.display = 'none';
  document.getElementById('chat-list').style.display = 'block';
  if (chatInterval) clearInterval(chatInterval);
  chatInterval = setInterval(checkAllUnread, 10000);
}

async function checkAllUnread() {
  for (const k of Object.keys(USERS)) {
    if (k === myKey) continue;
    try {
      const data = await gasRequest({ action: 'getChat', from: myKey, to: k, t: Date.now() });
      const msgs = data.messages || [];
      const unread = msgs.filter(m => m.from !== myKey && (!m.readBy || m.readBy.indexOf(myKey) === -1)).length;
      const el = document.getElementById('unread-' + k);
      if (el) el.textContent = unread > 0 ? unread : '';
    } catch(e) {}
  }
}

function updateMyUI() {
  ['work','posting','saving','off'].forEach(s => {
    document.getElementById('btn-' + s).className = 'status-opt' + (s === currentStatus ? ' active-' + s : '');
  });
}

async function setStatus(status) {
  currentStatus = status;
  try { sessionStorage.setItem('gw_page_status_' + myKey, status); } catch(e){}
  updateMyUI();
  try {
    await gasRequest({ key: myKey, active: status !== 'off', status: status });
  } catch(e) { console.log('送信エラー:', e); }
}

async function fetchStatus() {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.textContent = '⏳';
  try {
    const data = await gasRequest({ t: Date.now() });
    const container = document.getElementById('others-status-cards');
    container.innerHTML = '';
    Object.keys(USERS).forEach(k => {
      if (k === myKey) return;
      const other = data[k];
      const st = other ? (other.status || (other.active ? 'work' : 'off')) : 'off';
      const info = STATUS_INFO[st] || STATUS_INFO['off'];
      let updText = '';
      if (other && other.updated) {
        const d = new Date(other.updated);
        updText = '最終更新: ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      }
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-label">相手のステータス</div>
        <div class="other-row">
          <span class="other-name">${USERS[k]}</span>
          <span class="other-st ${info.cls}">${info.text}</span>
        </div>
        <div class="upd-time">${updText}</div>`;
      container.appendChild(card);
    });
  } catch(e) {
    console.log('ステータス取得エラー:', e);
  }
  if (btn) btn.textContent = '🔄 更新';
}

async function fetchChat() {
  if (!currentPartner) return;
  try {
    const data = await gasRequest({ action: 'getChat', from: myKey, to: currentPartner, t: Date.now() });
    const box = document.getElementById('chat-box');
    const msgs = data.messages || [];
    if (msgs.length === 0) {
      box.innerHTML = '<span class="chat-empty">メッセージはまだありません</span>';
      return;
    }
    const wasBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    box.innerHTML = msgs.map(m => {
      const mine = m.from === myKey;
      const d = new Date(m.time);
      const hhmm = isNaN(d.getTime()) ? '' : d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      const readBy = m.readBy ? String(m.readBy) : '';
      const isRead = mine && readBy.split(',').some(k => k.trim() && k.trim() !== myKey);
      return `<div class="msg-row ${mine ? 'mine' : 'theirs'}">
        <div class="msg-name">${USERS[m.from] || m.from}</div>
        <div class="msg-bubble">${escHtml(m.msg)}</div>
        <div class="msg-time">${hhmm}</div>
        ${mine ? `<div class="msg-read">${isRead ? '既読' : ''}</div>` : ''}
      </div>`;
    }).join('');
    if (wasBottom) box.scrollTop = box.scrollHeight;
  } catch(e) { console.log('チャット取得エラー:', e); }
}

async function sendChat() {
  if (!currentPartner) return;
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  input.value = '';
  try {
    await gasRequest({ action: 'sendChat', from: myKey, to: currentPartner, msg: msg });
    await fetchChat();
    const box = document.getElementById('chat-box');
    box.scrollTop = box.scrollHeight;
  } catch(e) { input.value = msg; }
  btn.disabled = false;
  input.focus();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// 前回ユーザー記憶
try {
  const saved = localStorage.getItem('gw_page_user');
  if (saved && USERS[saved]) selectUser(saved);
} catch(e) {}
</script>
